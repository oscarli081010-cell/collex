<!-- Supabase → Authentication → Emails → Reset password
     Subject: Reset your Collex password -->
<!doctype html>
<html lang="en-AU">
  <body style="margin:0;padding:0;background:#fbfaf7;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fbfaf7;padding:48px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #e6e2d9;border-radius:16px;">
            <tr>
              <td style="padding:40px 40px 0;font-family:Georgia,'Times New Roman',serif;font-size:24px;color:#15161a;">Collex</td>
            </tr>
            <tr>
              <td style="padding:28px 40px 0;font-family:Georgia,'Times New Roman',serif;font-size:28px;line-height:1.2;color:#15161a;">
                Reset your password
              </td>
            </tr>
            <tr>
              <td style="padding:14px 40px 0;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:15px;line-height:1.6;color:#6b6e76;">
                We received a request to reset the password for your Collex account. Choose a new one below.
              </td>
            </tr>
            <tr>
              <td style="padding:24px 40px 0;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 22px;border-radius:10px;background:#15161a;color:#ffffff;text-decoration:none;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:15px;font-weight:600;">Set a new password</a>
              </td>
            </tr>
            <tr>
              <td style="padding:32px 40px 40px;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:13px;line-height:1.6;color:#9a9ca3;">
                The link expires in one hour. If you did not ask for this, ignore this email and your password stays the same.
              </td>
            </tr>
          </table>
          <p style="margin:20px 0 0;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:12px;color:#9a9ca3;">Collex · The Sydney Model UN circuit · collex.au</p>
        </td>
      </tr>
    </table>
  </body>
</html>

# Every 30 minutes: fetch the live site. If anything is wrong the run fails, and GitHub emails the repository owner
# (Settings > Notifications > Actions: "Send notifications for failed workflows only" is a good choice).
name: Uptime
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the site
        run: |
          fail=0
          for path in "/" "/conferences" "/sitemap.xml" "/calendar.ics"; do
            url="https://collex.au$path"
            # Retry once: a single dropped connection shouldn't wake anyone.
            code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 20 -L "$url" || echo 000)
            if [ "$code" != "200" ]; then sleep 20; code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 20 -L "$url" || echo 000); fi
            if [ "$code" != "200" ]; then
              echo "::error title=Down::$url answered $code"
              fail=1
              continue
            fi
            echo "$url answered 200"
            if [ "$path" = "/" ] && ! grep -q "Collex" /tmp/body; then
              echo "::error title=Wrong page::$url answered 200 but the page does not say Collex"
              fail=1
            fi
          done
          exit $fail
